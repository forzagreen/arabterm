[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabterm"
version = "2.2.0"
description = "A collection of Arabic terminology"
authors = [
    { name = "forzagreen" },
]
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pymysql",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pip",
    "ruff",
]
# Only for `make hf_export` / `make hf_push` (the Hugging Face mirror).
hf = [
    "huggingface_hub",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/forzagreen/arabterm"

[tool.setuptools]
packages = ["arabterm"]
